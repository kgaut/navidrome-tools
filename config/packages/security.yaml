security:
    password_hashers:
        App\Security\EnvUser: 'auto'

    providers:
        env_user_provider:
            id: App\Security\EnvUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Découverte OAuth, jeton, enregistrement de client (issue #276) :
        # publics, sans session. /authorize reste dans `main` (connexion
        # puis écran de consentement).
        oauth_public:
            pattern: ^/(token$|oauth/register$|\.well-known/)
            security: false

        # Serveur MCP : jeton OAuth seulement, aucun cookie de session.
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: env_user_provider
            oauth2: true

        api:
            pattern: ^/api
            stateless: true
            provider: env_user_provider
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator

        main:
            lazy: true
            provider: env_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/mcp, roles: ROLE_OAUTH2_MCP }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Security\EnvUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
