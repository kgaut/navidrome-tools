; Allow uploading the Strawberry database (can be ~200 MB).
upload_max_filesize = 200M
post_max_size = 210M

; The matching cascade keeps an in-memory index of the library (issues #279,
; #282): ~57 MB retained, 73 MB peak for 31 600 tracks, measured. With Symfony
; and the ORM on top, PHP's 128M default is exceeded by the sync, the relink
; and the diagnosis (issue #290).
memory_limit = 512M
